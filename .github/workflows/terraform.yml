name: Terraform - plan and apply

on:
  push:
    branches: [master]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Type yes to apply the changes (anything else = plan only)"
        required: true
        default: "no"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::656446902115:role/re-gha-terraform
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.x"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply (only when you typed yes)
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'yes'
        run: terraform apply -input=false tfplan